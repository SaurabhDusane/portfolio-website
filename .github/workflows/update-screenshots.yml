name: Update screenshots

# Run this from the Actions tab on a branch whose layout changed on purpose:
# it builds the site, re-takes every screenshot in tests/screens and commits
# the new images to the same branch. Then re-run CI on the pull request
# (pushes made by this workflow don't start CI on their own).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          SITE_OFFLINE: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:screens:update

      - name: Commit new screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/screens/__screenshots__
          if git diff --cached --quiet; then
            echo "Screenshots already match; nothing to commit."
          else
            git commit -q -m "Update screenshots"
            git push -q origin "HEAD:$GITHUB_REF_NAME"
            echo "New screenshots committed to $GITHUB_REF_NAME. Re-run CI on the pull request."
          fi
