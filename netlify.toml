[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Next exports generated metadata images without a file extension;
# set the type explicitly so browsers and link-preview crawlers accept them.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/icon"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/apple-icon"
  [headers.values]
    Content-Type = "image/png"
