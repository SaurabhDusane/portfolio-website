[build]
  command = "npm run build"
  publish = "out"

# Mirrored in vercel.json for Vercel deployments.

# Each route is exported as its own HTML file, so no SPA fallback is needed:
# unknown URLs get Netlify's automatic 404 (out/404.html) with a real 404 status.

# /bio was the old About URL.
[[redirects]]
  from = "/bio"
  to = "/about"
  status = 301
  force = true  # bio.html exists in the export; force the redirect over it

# The resume used to live at a longer filename; links already shared keep working.
[[redirects]]
  from = "/Resume_Saurabh_Nilesh_Dusane.pdf"
  to = "/resume.pdf"
  status = 301

# Older projects no longer have their own page; they are listed under "Earlier work".
[[redirects]]
  from = "/projects/predictive-analytics-platform"
  to = "/projects#earlier-work"
  status = 301

[[redirects]]
  from = "/projects/smart-agriculture"
  to = "/projects#earlier-work"
  status = 301

[[redirects]]
  from = "/projects/lstm-election-forecasting"
  to = "/projects#earlier-work"
  status = 301

[[redirects]]
  from = "/projects/fake-news-video-detection"
  to = "/projects#earlier-work"
  status = 301

[[redirects]]
  from = "/projects/ai-traffic-optimization"
  to = "/projects#earlier-work"
  status = 301

# Next exports generated metadata images without a file extension;
# set the type explicitly so browsers and link-preview crawlers accept them.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/icon"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/apple-icon"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/projects/*/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
